name: CI Pipeline

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('package.json', 'eslint.config.js') != '' }}
        run: npm run lint

      - name: Build or type check
        if: ${{ hashFiles('package.json', 'tsconfig.json') != '' }}
        run: npm run build

      - name: Test
        if: ${{ hashFiles('package.json', 'vitest.config.ts', 'package-lock.json') != '' }}
        run: npm run test

      - name: Summary
        if: always()
        run: echo "Node ${{ matrix.node-version }}: ${{ github.event_name }} on ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
